<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3182f6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="굿즈샵">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>결제 실패 - 굿즈샵</title>
  <link rel="stylesheet" href="style.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="app.js?v=3"></script>
</head>
<body>
  <header id="header"></header>
  <main>
    <div class="box">
      <h1>결제에 실패했습니다</h1>
      <p class="msg" id="msg"></p>
      <a class="primary" href="index.html">상품 목록으로</a>
    </div>
  </main>
  <script>
    renderHeader();
    // 토스가 보낸 message 표시 (textContent라 안전)
    document.getElementById('msg').textContent =
      new URLSearchParams(location.search).get('message') || '결제가 취소되었거나 실패했습니다';
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 - 굿즈샵</title>
  <link rel="stylesheet" href="style.css?v=2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="app.js?v=2"></script>
  <style>
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; padding: 4px; background: #f2f4f6; border-radius: 12px; }
    .tabs button { flex: 1; min-height: 44px; font: inherit; color: #6b7684; background: none; border: 0; border-radius: 10px; cursor: pointer; }
    .tabs button.on { color: #191f28; background: #fff; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  </style>
</head>
<body>
  <header id="header"></header>
  <main>
    <div class="box">
      <h1 id="title">다시 만나서 반가워요</h1>
      <p class="lead" id="lead">로그인하고 쇼핑을 이어가세요</p>
      <div class="tabs">
        <button id="tab-login" class="on" type="button">로그인</button>
        <button id="tab-signup" type="button">회원가입</button>
      </div>
      <label>이메일<input id="email" type="email" autocomplete="email"></label>
      <label>비밀번호 (6자 이상)<input id="password" type="password" autocomplete="current-password"></label>
      <p class="msg" id="msg"></p>
      <button class="primary" id="submit" type="button">로그인</button>
    </div>
  </main>
  <script>
    renderHeader();
    let mode = 'login'; // 'login' 또는 'signup'
    const $ = (id) => document.getElementById(id);

    // 탭 전환
    function setMode(m) {
      mode = m;
      $('tab-login').className = m === 'login' ? 'on' : '';
      $('tab-signup').className = m === 'signup' ? 'on' : '';
      $('submit').textContent = m === 'login' ? '로그인' : '회원가입';
      $('title').textContent = m === 'login' ? '다시 만나서 반가워요' : '처음 오셨나요?';
      $('lead').textContent = m === 'login' ? '로그인하고 쇼핑을 이어가세요' : '이메일만 있으면 바로 시작할 수 있어요';
      $('msg').textContent = '';
    }
    $('tab-login').onclick = () => setMode('login');
    $('tab-signup').onclick = () => setMode('signup');

    $('submit').onclick = async () => {
      const email = $('email').value.trim();
      const password = $('password').value;
      const msg = $('msg');
      msg.textContent = '';
      if (!email || password.length < 6) {
        msg.textContent = '이메일을 입력하고 비밀번호는 6자 이상으로 입력하세요';
        return;
      }
      $('submit').disabled = true;
      let error, session;
      if (mode === 'signup') {
        const r = await sb.auth.signUp({ email, password });
        error = r.error;
        session = r.data && r.data.session;
        if (!error && !session) { // 세션이 없으면 바로 로그인
          const r2 = await sb.auth.signInWithPassword({ email, password });
          error = r2.error;
        }
      } else {
        const r = await sb.auth.signInWithPassword({ email, password });
        error = r.error;
      }
      $('submit').disabled = false;
      if (error) {
        const m = error.message || '';
        if (/already registered/i.test(m)) msg.textContent = '이미 가입된 이메일입니다';
        else if (/at least 6/i.test(m)) msg.textContent = '비밀번호는 6자 이상이어야 합니다';
        else if (/invalid login/i.test(m)) msg.textContent = '이메일 또는 비밀번호가 올바르지 않습니다';
        else msg.textContent = mode === 'login' ? '이메일 또는 비밀번호가 올바르지 않습니다' : '가입에 실패했습니다: ' + m;
        return;
      }
      location.href = 'index.html';
    };
  </script>
</body>
</html>
